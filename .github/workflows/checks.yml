name: Checks
on: [pull_request, push]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node bench/fetch-fonts.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:text
      - run: npm run check:reader
      - run: npm run check:romanization
