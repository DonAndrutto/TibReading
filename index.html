<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Interactive Tibetan reading and writing practice — the 30 consonants, 4 vowels, stacks, spelling-to-sound rules, letter tracing and annotated proverbs." />
  <meta name="theme-color" content="#F4ECD8" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg"/>
  <meta name="apple-mobile-web-app-title" content="TibReading"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <style>
    .boot-screen { min-height: 100vh; min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 20px; margin: 0; background: #F4ECD8; color: #7A1F1F; font: 18px/1.5 Georgia, serif; text-align: center; }
    body:has(.boot-screen) { margin: 0; }
    .boot-screen img { border-radius: 18px; }
    .boot-screen p { margin: 0; }
    .boot-dots { display: flex; gap: 8px; }
    .boot-dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: boot-pulse 1.2s ease-in-out infinite; }
    .boot-dots i:nth-child(2) { animation-delay: .15s; }
    .boot-dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes boot-pulse { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-5px); } }
    @media(prefers-reduced-motion: reduce) { .boot-dots i { animation: none; } }
    @media(prefers-color-scheme: dark) { .boot-screen { background: #211f1c; color: #f1e4ca; } }
  </style>
  <title>Tibetan Manual — Reading &amp; Writing</title>
</head>
<body>
  <div id="root">
    <div class="boot-screen" role="status" aria-label="Loading TibReading">
      <img src="./icon.svg" width="80" height="80" alt=""/>
      <p>Opening TibReading…</p>
      <span class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
  </div>
  <noscript><style>.boot-screen { display: none; }</style><p>Please enable JavaScript to open TibReading. Your saved progress stays on this device.</p></noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
